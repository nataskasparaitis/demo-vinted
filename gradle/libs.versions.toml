[versions] # pinned version numbers, referenced by nickname below
compileSdk = "35" # Android API level the app is compiled against (Android 15)
minSdk = "26" # lowest Android version the app will run on (Android 8.0)
targetSdk = "35" # Android version the app is tested/optimized for

android-gradle-plugin = "8.5.1" # the plugin that builds Android apps
androidx-appcompact = "1.7.0" # backward-compatible Activity/UI base classes
androidx-constraintlayout = "2.1.4" # constraint-based layout engine
androidx-core-ktx = "1.13.1" # Kotlin helper extensions for Android APIs
androidx-espresso = "3.6.1" # UI testing framework
androidx-fragment = "1.8.2" # the Fragment library (sub-screens)
androidx-junit-ext = "1.2.1" # JUnit helpers for on-device tests
androidx-lifecycle = "2.8.4" # ViewModel + lifecycle-aware components
androidx-recycleview = "1.3.2" # the scrollable list/grid widget
coreTesting = "2.2.0" # helpers for testing architecture components
coroutines-test = "1.8.0" # tools for testing coroutines
detekt = "1.23.8" # Kotlin static-analysis linter
glide = "4.16.0" # image loading/caching library
hilt = "2.51.1" # dependency-injection framework
junit = "4.13.2" # the core unit-testing framework
kirich1409-viewbindingpropertydelegate = "1.5.9" # one-liner ViewBinding helper
kotlin = "1.9.23" # the Kotlin language/compiler version
ksp = "1.9.23-1.0.20" # Kotlin Symbol Processing (codegen engine)
material = "1.12.0" # UI components (Material Design)
mockitoCore = "5.12.0" # mocking library (declared, unused here)
mockitoKotlin = "5.3.1" # Kotlin-friendly Mockito (unused here)
moshi = "1.15.1" # JSON parser
retrofit = "2.11.0" # HTTP client
turbine = "1.1.0" # helper for testing Kotlin Flows


[libraries] # each dependency gets a nickname used in build.gradle.kts
androidx-appcompact = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompact" } # compatible UI base classes
androidx-constaintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" } # constraint layouts
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" } # Kotlin extensions for Android
androidx-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "coreTesting" } # arch test helpers (unused)
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" } # UI testing core
androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "androidx-espresso" } # extra Espresso actions (RecyclerView)
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" } # Fragment library
androidx-junit-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-junit-ext" } # JUnit runner for on-device tests
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" } # LiveData observables
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" } # ViewModel support
androidx-recycleview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recycleview" } # scrollable list/grid
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" } # coroutine test tools
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" } # detekt formatting rules
detekt-rules = { module = "io.gitlab.arturbosch.detekt:detekt-rules-libraries", version.ref = "detekt" } # extra detekt rules
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" } # image loading
glide-compiler = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" } # Glide code generator
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" } # Hilt DI runtime
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" } # Hilt code generator
junit = { module = "junit:junit", version.ref = "junit" } # unit-test framework
kirich1409-viewbindingpropertydelegate = { module = "com.github.kirich1409:viewbindingpropertydelegate-full", version.ref = "kirich1409-viewbindingpropertydelegate" } # ViewBinding one-liner
material = { module = "com.google.android.material:material", version.ref = "material" } # Material design components
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" } # mocking (declared, unused)
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" } # Kotlin mocking (unused)
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" } # JSON parser core
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" } # Moshi support for Kotlin classes
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" } # HTTP client
retrofit-moshi-convertor = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" } # plug Moshi into Retrofit
retrofit-rxadapter = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" } # RxJava adapter (declared, unused)
turbin = { module = "app.cash.turbine:turbine", version.ref = "turbine" } # Flow testing helper

[plugins] # build plugins, referenced by nickname
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" } # builds the Android app
dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } # enables Hilt DI
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" } # runs the linter
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" } # Kotlin support for Android
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" } # auto-generates Parcelable code
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" } # runs annotation code generators